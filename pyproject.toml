[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-python"
dynamic = ["version"]
description = "Transit marshalling for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cognitect" }]
requires-python = ">=3.10"
dependencies = ["msgpack>=1.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/cognitect/transit-python"
Specification = "https://github.com/cognitect/transit-format"

[tool.setuptools]
packages = ["transit"]

[tool.setuptools.dynamic]
version = { attr = "transit.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "regression.py"]
