[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-python"
dynamic = ["version"]
description = "Transit marshalling for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cognitect" }]
maintainers = [{ name = "Vendekagon Labs LLC" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
msgpack = ["msgpack>=1.0"]
test = ["pytest", "msgpack>=1.0"]

[project.urls]
Homepage = "https://github.com/vendekagon-labs/transit-python"
Issues = "https://github.com/vendekagon-labs/transit-python/issues"
Specification = "https://github.com/cognitect/transit-format"
Original = "https://github.com/cognitect/transit-python"

[tool.setuptools]
packages = ["transit"]

[tool.setuptools.dynamic]
version = { attr = "transit.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "regression.py"]

[tool.setuptools.exclude-package-data]
transit = ["*.c"]

# Wheels, built by .github/workflows/wheels.yml. The extension uses the limited
# API, so building with the oldest supported CPython gives one cp310-abi3 wheel
# per platform that installs on every Python from 3.10. Free-threaded CPython
# can't use abi3, so it gets its own wheels. Anywhere else, pip installs the
# sdist, which compiles the extension if it can and otherwise installs as pure
# Python.
[tool.cibuildwheel]
build = ["cp310-*", "cp314t-*"]
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_i686"]
test-requires = ["pytest", "msgpack"]
# --import-mode=append: test the installed wheel, not the transit/ source
# directory next to the tests
test-command = [
  "python -c \"import transit._accel as a; assert a.native is not None, 'no native extension'\"",
  "pytest --import-mode=append {project}/tests",
]

[tool.cibuildwheel.linux]
archs = ["auto64"]

[tool.cibuildwheel.macos]
archs = ["native"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["native"]
